name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build web (icons + vue-tsc + vite)
        run: bun run build

      - name: Build worker (wrangler dry-run)
        run: bun run build
        working-directory: apps/worker

      - name: Integration tests (D1 migration validation)
        run: bun run test:integration
